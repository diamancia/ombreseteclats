services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Le conteneur Mongo ("mongodb-local") tourne déjà à part, en dehors de ce compose.
      # On le joint via host.docker.internal plutôt que de le redéfinir ici, pour ne pas
      # dupliquer les données ni entrer en conflit sur le port 27017 déjà publié.
      - MONGODB_URI=mongodb://host.docker.internal:27017/${MONGODB_DB:-ayara}
      - MONGODB_DB=${MONGODB_DB:-ayara}
      - JWT_SECRET=${JWT_SECRET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_KEY=${NEXT_PUBLIC_STRIPE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - META_PAGE_ID=${META_PAGE_ID}
      - META_IG_BUSINESS_ACCOUNT_ID=${META_IG_BUSINESS_ACCOUNT_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
